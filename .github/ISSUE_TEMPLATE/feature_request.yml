name: Feature request
description: Propose new functionality or a shape change to an existing API.
labels: ["feature"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What can't you do today? Start here, not with the solution.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed shape
      description: Sketch the API/behavior you'd want, if you have one in mind.
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
